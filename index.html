```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Inter", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;

            /* Background */
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 119, 255, 0.18), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(0, 200, 255, 0.12), transparent 35%),
                linear-gradient(135deg, #05070c, #0b111c, #05070c);

            position: relative;
        }

        /* Background particles */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            animation: float 7s ease-in-out infinite alternate;
            pointer-events: none;
        }

        body::before {
            background: #0077ff;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #00b7ff;
            bottom: -100px;
            right: -100px;
            animation-delay: 2s;
        }

        /* Card */
        .card {
            position: relative;
            z-index: 2;

            width: 90%;
            max-width: 480px;

            padding: 35px 30px;

            text-align: center;

            background: rgba(15, 20, 30, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.55),
                0 0 40px rgba(0, 119, 255, 0.08);

            animation: cardEnter 0.8s ease-out;
        }

        /* Top glow */
        .card::before {
            content: "";
            position: absolute;
            top: -1px;
            left: 15%;
            width: 70%;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                #008cff,
                transparent
            );

            box-shadow: 0 0 15px #008cff;
        }

        /* Status */
        .status {
            font-size: 1.15rem;
            font-weight: 600;
            margin-top: 5px;
            min-height: 28px;

            animation: textFade 0.8s ease;
        }

        .info {
            color: #42a5ff;
            text-shadow: 0 0 15px rgba(66, 165, 255, 0.45);
        }

        .error {
            color: #ff5555;
            text-shadow: 0 0 15px rgba(255, 85, 85, 0.35);
        }

        /* Loading animation */
        .loader {
            width: 42px;
            height: 42px;
            margin: 0 auto 22px;

            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #168cff;
            border-right-color: #00c8ff;

            border-radius: 50%;

            animation: spin 0.9s linear infinite;

            box-shadow:
                0 0 15px rgba(0, 140, 255, 0.35);
        }

        /* User agent */
        .ua-box {
            margin-top: 25px;

            font-size: 0.78rem;
            line-height: 1.6;

            color: #8e9aaa;

            word-break: break-all;

            background: rgba(0, 0, 0, 0.28);

            padding: 13px 15px;

            border-radius: 10px;

            border: 1px solid rgba(255, 255, 255, 0.06);

            text-align: left;

            transition: border-color 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .ua-box:hover {
            border-color: rgba(0, 140, 255, 0.35);
            box-shadow: 0 0 20px rgba(0, 140, 255, 0.08);
        }

        .ua-box strong {
            color: #cbd5e1;
            font-weight: 600;
        }

        /* Loading dots */
        .dots {
            display: inline-flex;
            margin-left: 3px;
        }

        .dots span {
            width: 4px;
            height: 4px;

            margin: 0 2px;

            border-radius: 50%;
            background: #42a5ff;

            animation: dots 1.2s infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Animations */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes textFade {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(40px, 30px);
            }
        }

        @keyframes dots {
            0%,
            60%,
            100% {
                opacity: 0.25;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        /* Mobile */
        @media (max-width: 500px) {
            .card {
                padding: 30px 20px;
                border-radius: 17px;
            }

            .status {
                font-size: 1rem;
            }

            .ua-box {
                font-size: 0.72rem;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="loader"></div>

        <div id="result" class="status info">
            Cek firmware
            <span class="dots">
                <span></span>
                <span></span>
                <span></span>
            </span>
        </div>

        <div id="user-agent" class="ua-box"></div>

    </div>

    <script>
        function processDevice() {
            const userAgent = navigator.userAgent;
            const resultElement = document.getElementById('result');
            const uaElement = document.getElementById('user-agent');

            uaElement.innerHTML =
                "<strong>User-Agent Terdeteksi:</strong><br>" +
                userAgent;

            const isPS4 = /PlayStation 4|PS4/i.test(userAgent);

            if (isPS4) {

                const fwMatch = userAgent.match(
                    /(?:PlayStation 4|PS4)[\s\/]+([\d\.]+)/i
                );

                if (fwMatch && fwMatch[1]) {

                    const firmware = parseFloat(fwMatch[1]);

                    resultElement.innerText =
                        `Terdeteksi PS4 (FW ${firmware.toFixed(2)})`;

                    if (firmware >= 5.00 && firmware <= 9.60) {

                        setTimeout(() => {
                            window.location.href = "505_960/index.html";
                        }, 1000);

                    }

                    else if (firmware >= 10.00 && firmware <= 11.02) {

                        setTimeout(() => {
                            window.location.href = "1000_1102/index.html";
                        }, 1000);

                    }

                    else if (firmware >= 11.50 && firmware <= 13.00) {

                        setTimeout(() => {
                            window.location.href = "1150-1300/index.html";
                        }, 1000);

                    }

                    else if (firmware >= 13.02 && firmware <= 13.52) {

                        setTimeout(() => {
                            window.location.href = "1302_1352/index.html";
                        }, 1000);

                    }

                    else {

                        resultElement.className = "status error";

                        resultElement.innerText =
                            `PS4 FW ${firmware.toFixed(2)} belum support.`;
                    }

                } else {

                    resultElement.className = "status error";

                    resultElement.innerText =
                        "Terdeteksi PS4, tetapi gagal membaca versi Firmware secara spesifik.";
                }

            } else {

                resultElement.className = "status error";

                resultElement.innerText =
                    "❌ Perangkat ini bukan PlayStation 4.";
            }
        }

        window.onload = processDevice;
    </script>

</body>
</html>
