<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>13.02–13.52 · PS4 Exploit</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background:
        radial-gradient(circle at 50% 35%, rgba(0, 112, 255, 0.18), transparent 35%),
        radial-gradient(circle at 20% 80%, rgba(0, 70, 180, 0.12), transparent 35%),
        linear-gradient(135deg, #02050c 0%, #06101f 50%, #02050c 100%);

    color: #ffffff;
    font-family: "Inter", Arial, sans-serif;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* Background glow */
body::before {
    content: "";
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: rgba(0, 110, 255, 0.08);
    filter: blur(80px);
    animation: pulseGlow 4s ease-in-out infinite;
    pointer-events: none;
}

/* Main card */
.cache-box {
    width: min(90%, 520px);
    padding: 42px 35px;

    text-align: center;

    background: rgba(8, 18, 34, 0.72);
    border: 1px solid rgba(80, 160, 255, 0.18);
    border-radius: 24px;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55),
        0 0 45px rgba(0, 100, 255, 0.08);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    animation: cardIn 0.7s ease-out;
}

/* PS4 style logo */
.logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background:
        linear-gradient(145deg, rgba(30, 130, 255, 0.2), rgba(0, 55, 130, 0.15));

    border: 1px solid rgba(90, 170, 255, 0.25);

    box-shadow:
        0 0 25px rgba(0, 110, 255, 0.18),
        inset 0 0 20px rgba(50, 140, 255, 0.06);
}

.logo span {
    font-size: 28px;
    font-weight: 700;
    color: #8ec5ff;
    text-shadow: 0 0 15px rgba(50, 150, 255, 0.7);
}

/* Title */
.title {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.3px;
}

.subtitle {
    margin-top: 8px;
    color: #7f91aa;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

/* Status area */
.status {
    margin-top: 32px;
}

/* Spinner */
.spinner {
    width: 46px;
    height: 46px;
    margin: 0 auto 22px;

    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.08);
    border-top-color: #3d9cff;
    border-right-color: #1678e8;

    animation: spin 0.9s linear infinite;

    box-shadow: 0 0 20px rgba(0, 120, 255, 0.18);
}

/* Message */
#msgs {
    min-height: 28px;

    color: #d9e7f8;
    font-size: 17px;
    font-weight: 500;

    letter-spacing: 0.2px;

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}

/* Progress line */
.progress {
    width: 100%;
    height: 4px;

    margin-top: 24px;

    overflow: hidden;
    border-radius: 10px;

    background: rgba(255, 255, 255, 0.07);
}

.progress::before {
    content: "";
    display: block;

    width: 35%;
    height: 100%;

    border-radius: inherit;

    background: linear-gradient(
        90deg,
        transparent,
        #268cff,
        #7dc3ff,
        transparent
    );

    box-shadow: 0 0 12px rgba(50, 150, 255, 0.8);

    animation: progressMove 1.5s ease-in-out infinite;
}

/* Bottom information */
.footer {
    margin-top: 25px;

    color: #52657e;
    font-size: 11px;
    letter-spacing: 0.8px;
}

/* Animations */
@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@keyframes progressMove {
    0% {
        transform: translateX(-130%);
    }

    100% {
        transform: translateX(380%);
    }
}

@keyframes pulseGlow {
    0%,
    100% {
        opacity: 0.55;
        transform: scale(1);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Mobile */
@media (max-width: 480px) {
    .cache-box {
        width: 88%;
        padding: 34px 24px;
        border-radius: 20px;
    }

    .title {
        font-size: 19px;
    }

    #msgs {
        font-size: 15px;
    }

    .logo {
        width: 56px;
        height: 56px;
    }
}
</style>

<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

function DLProgress(e) {
    var pct = Math.round(e.loaded / e.total * 100);

    msgs.innerHTML = "Installing... " + pct + "%";
}

function DisplayCacheProgress() {
    setTimeout(function () {
        msgs.innerHTML = "Cache OK";
    }, 2000);

    setTimeout(function () {
        location.reload();
    }, 3000);
}

window.applicationCache.addEventListener(
    "progress",
    DLProgress,
    false
);

window.applicationCache.oncached = function (e) {
    DisplayCacheProgress();
};

window.applicationCache.onupdateready = function (e) {
    DisplayCacheProgress();
};
</script>

</head>

<body>

<div class="cache-box">

    <div class="logo">
        <span>PS4</span>
    </div>

    <h1 class="title">
        13.02–13.52 · PS4 Exploit
    </h1>

    <div class="subtitle">
        Offline Cache Installer
    </div>

    <div class="status">

        <div class="spinner"></div>

        <div id="msgs">
            Installing cache...
        </div>

        <div class="progress"></div>

    </div>

    <div class="footer">
        Please wait while the exploit files are being cached
    </div>

</div>

</body>
</html>
