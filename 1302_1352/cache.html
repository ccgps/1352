<!DOCTYPE html>
<html lang="id" manifest="cache.appcache">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>13.02-13.52 · PS4 Exploit</title>

    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(0, 132, 255, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(0, 200, 255, 0.13),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #03060b,
                    #07111f,
                    #03060b
                );

            color: #e7edf5;

            font-family: "Inter", sans-serif;

            overflow: hidden;
        }

        /* Background glow */

        body::before,
        body::after {
            content: "";
            position: fixed;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.15;

            pointer-events: none;

            animation: float 8s ease-in-out infinite alternate;
        }

        body::before {
            background: #008cff;
            top: -120px;
            left: -100px;
        }

        body::after {
            background: #00c8ff;
            right: -120px;
            bottom: -120px;

            animation-delay: 2s;
        }

        /* Main container */

        .container {
            width: 100%;
            max-width: 720px;

            position: relative;
            z-index: 2;

            animation: containerIn 0.7s ease-out;
        }

        /* Header */

        .header {
            display: flex;
            align-items: center;
            gap: 14px;

            margin-bottom: 15px;
        }

        .logo {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #087fff,
                    #00bfff
                );

            box-shadow:
                0 0 25px rgba(0, 140, 255, 0.30);

            font-size: 20px;
            font-weight: 700;

            animation: pulse 2.5s ease-in-out infinite;
        }

        .title {
            font-size: 17px;
            font-weight: 600;

            letter-spacing: 0.2px;
        }

        .subtitle {
            margin-top: 3px;

            color: #728197;

            font-size: 12px;
        }

        /* Terminal */

        .terminal {
            position: relative;

            background: rgba(8, 13, 21, 0.88);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 16px;

            overflow: hidden;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55),
                0 0 35px rgba(0, 130, 255, 0.08);
        }

        /* Terminal top bar */

        .terminal-bar {
            height: 42px;

            display: flex;
            align-items: center;

            padding: 0 15px;

            background: rgba(255, 255, 255, 0.025);

            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            margin-right: 7px;

            background: #344154;
        }

        .terminal-label {
            margin-left: 8px;

            color: #65748a;

            font-family: monospace;
            font-size: 11px;
        }

        /* Console */

        #console {
            min-height: 250px;

            padding: 22px;

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 13px;
            line-height: 1.8;

            white-space: pre-wrap;
            word-break: break-word;

            color: #aab7c8;
        }

        #console span {
            display: block;

            animation: lineIn 0.25s ease-out;
        }

        .ok {
            color: #43d17d;
            text-shadow: 0 0 10px rgba(67, 209, 125, 0.18);
        }

        .bad {
            color: #ff5d68;
            text-shadow: 0 0 10px rgba(255, 93, 104, 0.15);
        }

        .warn {
            color: #ffc857;
            text-shadow: 0 0 10px rgba(255, 200, 87, 0.12);
        }

        /* Footer */

        .footer {
            margin-top: 12px;

            text-align: center;

            color: #526176;

            font-size: 11px;
        }

        /* Animations */

        @keyframes containerIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes lineIn {
            from {
                opacity: 0;
                transform: translateX(-5px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                box-shadow:
                    0 0 20px rgba(0, 140, 255, 0.25);
            }

            50% {
                box-shadow:
                    0 0 35px rgba(0, 180, 255, 0.45);
            }
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(35px, 25px);
            }
        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .header {
                margin-bottom: 12px;
            }

            .logo {
                width: 40px;
                height: 40px;
            }

            .title {
                font-size: 15px;
            }

            #console {
                min-height: 230px;
                padding: 18px;

                font-size: 12px;
            }
        }
    </style>

    <script>
        if (
            window.applicationCache &&
            window.applicationCache.status == 0
        ) {
            window.location.replace("cache.html");
        }
    </script>
</head>

<body>

    <main class="container">

        <div class="header">

            <div class="logo">
                PS4
            </div>

            <div>
                <div class="title">
                    PS4 Exploit Loader
                </div>

                <div class="subtitle">
                    Firmware 13.02 — 13.52
                </div>
            </div>

        </div>

        <section class="terminal">

            <div class="terminal-bar">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

                <span class="terminal-label">
                    exploit-loader
                </span>

            </div>

            <pre id="console"></pre>

        </section>

        <div class="footer">
            Waiting for device input · Press X / O when prompted
        </div>

    </main>

</body>

<script>
(function () {

    var con = document.getElementById("console");

    function print(msg, cls) {

        var span = document.createElement("span");

        if (cls)
            span.className = cls;

        span.textContent = msg;

        con.appendChild(span);

    }

    var params = new URLSearchParams(location.search);

    // Firmwares with measured kernel table
    // KEEP IN SYNC with ps4_offsets.js

    var SUPPORTED = {
        1302: 1,
        1304: 1,
        1350: 1,
        1352: 1
    };

    var key = null;
    var fwnum = null;

    var m =
        /PlayStation\s+4[\/ ](\d+)\.(\d+)/
        .exec(navigator.userAgent);

    if (m) {

        var ms =
            parseInt(m[2], 16).toString(16);

        if (ms.length < 2)
            ms = "0" + ms;

        key =
            m[1] + "." + ms;

        fwnum =
            parseInt(m[1], 10) * 100 +
            parseInt(ms, 10);
    }

    var forced =
        params.get("force") === "1";

    var supported =
        forced ||
        (
            fwnum !== null &&
            SUPPORTED[fwnum] === 1
        );

    print(
        "> firmware: " +
        (key || "unknown")
    );

    print(
        "> supported: " +
        (supported ? "yes" : "no"),
        supported ? "ok" : "bad"
    );

    var target =
        "jb.html" + location.search;

    function go() {

        print(
            "> loading exploit...",
            "warn"
        );

        location.replace(target);
    }

    function waitForTap(msg, action) {

        if (msg)
            print("> " + msg, "warn");

        function fire() {

            window.removeEventListener(
                "click",
                fire
            );

            window.removeEventListener(
                "keydown",
                fire
            );

            action();
        }

        window.addEventListener(
            "click",
            fire
        );

        window.addEventListener(
            "keydown",
            fire
        );
    }

    if (!supported) {

        print(
            "> Perangkat ini bukan PS4 Bro",
            "bad"
        );

        waitForTap("", go);

        return;
    }

    var ac =
        window.applicationCache;

    if (
        !ac ||
        !document.documentElement
            .hasAttribute("manifest")
    ) {

        go();

    } else if (!navigator.onLine) {

        print(
            "> offline — running from cache",
            "ok"
        );

        go();

    } else if (ac.status === ac.IDLE) {

        print(
            "> cached",
            "ok"
        );

        go();

    } else if (ac.status === ac.UPDATEREADY) {

        try {
            ac.swapCache();
        } catch (e) {}

        print(
            "> update downloaded",
            "ok"
        );

        waitForTap(
            "UPDATE READY — Press X/O to reload",
            function () {
                location.reload();
            }
        );

    } else {

        print(
            "> checking cache..."
        );

        ac.addEventListener(
            "downloading",
            function () {

                print(
                    "> caching for offline (first run)..."
                );

            },
            false
        );

        ac.addEventListener(
            "progress",
            function (e) {

                if (e && e.total) {

                    print(
                        "> caching " +
                        Math.round(
                            (e.loaded / e.total) * 100
                        ) +
                        "%"
                    );
                }

            },
            false
        );

        ac.addEventListener(
            "cached",
            function () {

                print(
                    "> cached for offline use",
                    "ok"
                );

                waitForTap(
                    "CACHED — Press X/O to run",
                    go
                );

            },
            false
        );

        ac.addEventListener(
            "updateready",
            function () {

                try {
                    ac.swapCache();
                } catch (e) {}

                print(
                    "> update downloaded",
                    "ok"
                );

                waitForTap(
                    "UPDATE READY — Press X/O to reload",
                    function () {
                        location.reload();
                    }
                );

            },
            false
        );

        ac.addEventListener(
            "noupdate",
            function () {

                print(
                    "> cached — offline ready",
                    "ok"
                );

                go();

            },
            false
        );

        ac.addEventListener(
            "error",
            function () {

                print(
                    "> cache unavailable"
                );

                waitForTap(
                    "CACHE FAILED — Press X/O to run anyway",
                    go
                );

            },
            false
        );

        ac.addEventListener(
            "obsolete",
            function () {

                print(
                    "> cache obsolete"
                );

                waitForTap(
                    "CACHE OBSOLETE — Press X/O to run",
                    go
                );

            },
            false
        );
    }

})();
</script>

</html>
