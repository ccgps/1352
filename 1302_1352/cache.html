<!DOCTYPE html>
<html lang="id" manifest="cache.appcache">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>13.02-13.52 · PS4 Exploit</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            color: #ffffff;

            font-family: "Inter", sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 132, 255, 0.22),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(0, 200, 255, 0.14),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #03060b,
                    #07111f,
                    #03060b
                );
        }

        /* Background glow */

        body::before,
        body::after {
            content: "";

            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.18;

            pointer-events: none;

            animation: float 8s ease-in-out infinite alternate;
        }

        body::before {
            background: #008cff;

            top: -130px;
            left: -100px;
        }

        body::after {
            background: #00c8ff;

            right: -130px;
            bottom: -130px;

            animation-delay: 2s;
        }

        /* Main card */

        .card {
            width: min(90%, 430px);

            padding: 38px 30px;

            text-align: center;

            position: relative;
            z-index: 2;

            background: rgba(8, 14, 23, 0.86);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55),
                0 0 40px rgba(0, 130, 255, 0.08);

            animation: cardIn 0.7s ease-out;
        }

        /* Top glow */

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 15%;

            width: 70%;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                #008cff,
                transparent
            );

            box-shadow: 0 0 15px #008cff;
        }

        /* PS4 icon */

        .logo {
            width: 58px;
            height: 58px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            font-size: 16px;
            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #087fff,
                    #00bfff
                );

            box-shadow:
                0 0 30px rgba(0, 150, 255, 0.35);

            animation: pulse 2.5s ease-in-out infinite;
        }

        /* Spinner */

        .spinner {
            width: 38px;
            height: 38px;

            margin: 0 auto 22px;

            border-radius: 50%;

            border: 3px solid rgba(255, 255, 255, 0.08);

            border-top-color: #168cff;
            border-right-color: #00c8ff;

            box-shadow:
                0 0 18px rgba(0, 150, 255, 0.25);

            animation: spin 0.85s linear infinite;
        }

        /* Status */

        #msgs {
            min-height: 28px;

            font-size: 17px;
            font-weight: 500;

            color: #dce8f7;

            letter-spacing: 0.1px;

            text-shadow:
                0 0 15px rgba(0, 150, 255, 0.2);

            animation: textIn 0.5s ease;
        }

        /* Small information */

        .subtitle {
            margin-top: 12px;

            color: #66768d;

            font-size: 11px;

            letter-spacing: 0.4px;
        }

        /* Progress bar */

        .progress {
            width: 100%;
            height: 4px;

            margin-top: 25px;

            overflow: hidden;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.07);
        }

        .progress-bar {
            width: 35%;
            height: 100%;

            border-radius: inherit;

            background: linear-gradient(
                90deg,
                #087fff,
                #00c8ff
            );

            box-shadow:
                0 0 12px rgba(0, 160, 255, 0.6);

            animation: progress 1.5s ease-in-out infinite;
        }

        /* Animations */

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes textIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes progress {
            0% {
                transform: translateX(-130%);
            }

            50% {
                transform: translateX(120%);
            }

            100% {
                transform: translateX(280%);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                box-shadow:
                    0 0 20px rgba(0, 140, 255, 0.25);
            }

            50% {
                box-shadow:
                    0 0 35px rgba(0, 180, 255, 0.45);
            }
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(35px, 25px);
            }
        }

        /* Mobile */

        @media (max-width: 500px) {

            .card {
                padding: 32px 22px;
            }

            #msgs {
                font-size: 15px;
            }
        }
    </style>

    <script>
        history.replaceState(null, null, 'index.html');

        var histlength = history.length;

        history.go(-histlength);

        function DLProgress(e) {

            if (!e || !e.total)
                return;

            var pct =
                Math.round(
                    e.loaded / e.total * 100
                );

            msgs.innerHTML =
                "Installing... " + pct + "%";
        }

        function DisplayCacheProgress() {

            msgs.innerHTML = "Cache OK";

            setTimeout(function () {
                msgs.innerHTML = "Cache OK";
            }, 2000);

            setTimeout(function () {
                location.reload();
            }, 3000);
        }

        window.applicationCache.addEventListener(
            "progress",
            DLProgress,
            false
        );

        window.applicationCache.oncached =
            function (e) {
                DisplayCacheProgress();
            };

        window.applicationCache.onupdateready =
            function (e) {
                DisplayCacheProgress();
            };
    </script>
</head>

<body>

    <div class="card">

        <div class="logo">
            PS4
        </div>

        <div class="spinner"></div>

        <div id="msgs">
            Installing...
        </div>

        <div class="subtitle">
            Preparing offline cache · Firmware 13.02–13.52
        </div>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

    </div>

</body>
</html>
