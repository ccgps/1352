<script>

/* =====================================================
   HISTORY
===================================================== */

history.replaceState(
    null,
    null,
    'index.html'
);

var histlength =
    history.length;

history.go(
    -histlength
);


/* =====================================================
   CACHE PROGRESS
===================================================== */

function DLProgress(e) {

    if (!e.total) {
        return;
    }

    var pct =
        Math.round(
            e.loaded /
            e.total *
            100
        );


    /* Update text */

    status.innerHTML =
        "Installing... " +
        pct +
        "%";


    /* Update progress bar */

    progressBar.style.width =
        pct + "%";


    /* Restart animation */

    status.style.animation =
        "none";

    void status.offsetWidth;

    status.style.animation =
        "statusIn .35s ease both";

}


/* =====================================================
   CACHE COMPLETE
===================================================== */

function DisplayCacheProgress() {

    /*
     * 100%
     */

    progressBar.style.width =
        "100%";


    /*
     * Stop spinner
     */

    loader.style.display =
        "none";


    /*
     * Success
     */

    status.innerHTML =
        "✓ Cache OK";

    status.classList.add(
        "success"
    );


    /*
     * Next process
     */

    setTimeout(
        function () {

            status.classList.remove(
                "success"
            );

            status.innerHTML =
                "Starting PS4 Exploit...";

            status.style.animation =
                "statusIn .45s ease both";

        },
        1000
    );


    /*
     * Reload
     */

    setTimeout(
        function () {

            location.reload();

        },
        3000
    );

}


/* =====================================================
   APPLICATION CACHE
===================================================== */

window.applicationCache.addEventListener(
    "progress",
    DLProgress,
    false
);


window.applicationCache.oncached =
    function (e) {

        DisplayCacheProgress();

    };


window.applicationCache.onupdateready =
    function (e) {

        DisplayCacheProgress();

    };

</script>
