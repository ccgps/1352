<!doctype html>
<html lang="en" manifest="cache.appcache">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>13.02–13.52 · PS4 Exploit</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg: #02050b;
      --panel: rgba(7, 16, 30, 0.78);
      --border: rgba(100, 170, 255, 0.16);
      --text: #dcecff;
      --muted: #6f839d;
      --blue: #3c9cff;
      --blue-light: #8bc7ff;
      --green: #57dc91;
      --red: #ff6878;
      --yellow: #ffc967;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100%;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(0, 115, 255, 0.16),
          transparent 34%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(0, 75, 190, 0.11),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #02050b 0%,
          #061222 50%,
          #02050b 100%
        );

      color: var(--text);

      font:
        15px/1.45 "Inter",
        "Segoe UI",
        system-ui,
        sans-serif;
    }

    /* Ambient background */
    body::before {
      content: "";

      position: fixed;
      width: 430px;
      height: 430px;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background: rgba(0, 110, 255, 0.07);
      filter: blur(90px);

      pointer-events: none;

      animation: ambient 5s ease-in-out infinite;
    }

    /* Header */
    #brand {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(4, 10, 19, 0.78);

      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      z-index: 10;
    }

    #brand::before {
      content: "";

      position: absolute;

      bottom: -1px;
      left: 50%;

      width: 120px;
      height: 1px;

      transform: translateX(-50%);

      background: var(--blue);

      box-shadow: 0 0 14px rgba(50, 145, 255, 0.7);
    }

    #brand b {
      color: #eef6ff;

      font-size: 14px;
      font-weight: 700;

      letter-spacing: 0.13em;

      text-shadow:
        0 0 16px rgba(70, 160, 255, 0.25);
    }

    /* Main loading area */
    #spin {
      position: fixed;

      top: calc(50% + 10px);
      left: 50%;

      width: 58px;
      height: 58px;

      margin: -29px 0 0 -29px;

      border: 3px solid rgba(100, 160, 220, 0.10);
      border-top-color: var(--blue);
      border-right-color: rgba(80, 170, 255, 0.45);

      border-radius: 50%;

      animation:
        spin 0.85s linear infinite,
        spinnerGlow 2s ease-in-out infinite;

      box-shadow:
        0 0 22px rgba(0, 120, 255, 0.10);
    }

    #spin::after {
      content: "";

      position: absolute;

      top: 50%;
      left: 50%;

      width: 7px;
      height: 7px;

      margin: -3.5px;

      border-radius: 50%;

      background: var(--blue-light);

      box-shadow:
        0 0 14px rgba(80, 170, 255, 0.9);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spinnerGlow {
      0%,
      100% {
        filter: brightness(0.9);
      }

      50% {
        filter: brightness(1.25);
      }
    }

    /* Fail message */
    #msg {
      position: fixed;

      top: 50%;
      left: 20px;
      right: 20px;

      transform: translateY(-50%);

      padding: 26px;

      text-align: center;

      color: #e9f3ff;

      font-size: 16px;
      font-weight: 500;

      letter-spacing: 0.4px;

      display: none;

      background: rgba(7, 17, 31, 0.82);

      border: 1px solid rgba(255, 100, 120, 0.20);
      border-radius: 18px;

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.45),
        0 0 30px rgba(255, 70, 90, 0.05);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    /* Content wrapper */
    #wrap {
      padding: 0;
    }

    #state,
    #out {
      display: none;
    }

    /* Success */
    body.done #spin {
      display: none;
    }

    /* Failure */
    body.fail #spin {
      display: none;
    }

    body.fail #msg {
      display: block;

      animation: messageIn 0.4s ease-out;
    }

    /* Log mode */
    body.log #spin,
    body.log #msg {
      display: none;
    }

    body.log #wrap {
      width: min(100%, 900px);

      margin: 0 auto;

      padding:
        82px
        18px
        18px;
    }

    body.log #state {
      display: block;

      margin: 0 0 14px;

      color: #eef6ff;

      font-size: 22px;
      font-weight: 700;

      letter-spacing: 0.2px;

      text-shadow:
        0 0 18px rgba(60, 150, 255, 0.18);
    }

    body.log #out {
      display: block;

      width: 100%;
      height: calc(100vh - 155px);

      overflow-y: auto;

      padding: 16px 18px;

      white-space: pre-wrap;
      word-break: break-word;

      color: #91a8c1;

      font:
        12px/1.7 "JetBrains Mono",
        Consolas,
        monospace;

      background:
        linear-gradient(
          145deg,
          rgba(5, 13, 25, 0.92),
          rgba(2, 7, 14, 0.92)
        );

      border: 1px solid var(--border);
      border-radius: 16px;

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.35),
        inset 0 0 30px rgba(0, 80, 180, 0.025);

      scrollbar-width: thin;
      scrollbar-color: #253b54 transparent;
    }

    body.log #out::-webkit-scrollbar {
      width: 6px;
    }

    body.log #out::-webkit-scrollbar-track {
      background: transparent;
    }

    body.log #out::-webkit-scrollbar-thumb {
      background: #253b54;
      border-radius: 10px;
    }

    /* Status colors */
    .ok,
    .safe {
      color: var(--green);
    }

    .bad,
    .danger {
      color: var(--red);
    }

    .warn {
      color: var(--yellow);
    }

    code {
      color: #9fc5ef;

      padding: 2px 5px;

      border-radius: 5px;

      background: rgba(70, 140, 220, 0.08);
    }

    /* Animations */
    @keyframes ambient {
      0%,
      100% {
        opacity: 0.45;
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1.12);
      }
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(-45%) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(-50%) scale(1);
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      #brand {
        height: 54px;
      }

      #brand b {
        font-size: 12px;
        letter-spacing: 0.09em;
      }

      #spin {
        width: 52px;
        height: 52px;

        margin:
          -26px
          0
          0
          -26px;
      }

      body.log #wrap {
        padding:
          72px
          12px
          12px;
      }

      body.log #state {
        font-size: 19px;
      }

      body.log #out {
        height: calc(100vh - 135px);

        padding: 13px;

        font-size: 11px;
        line-height: 1.6;

        border-radius: 13px;
      }

      #msg {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div id="brand">
    <b>13.02–13.52 · PS4 EXPLOIT</b>
  </div>

  <div id="spin"></div>

  <div id="msg">
    Tahan tombol PS &gt; Power &gt; Restart PS4
  </div>

  <div id="wrap">
    <div id="state"></div>
    <div id="out"></div>
  </div>

  <script type="module">
    import "./jb.js?v=19";
  </script>

</body>
</html>
