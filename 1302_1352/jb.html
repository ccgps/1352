<!doctype html>
<html lang="en" manifest="cache.appcache">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>13.02-13.52 · PS4 Exploit</title>

    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(0, 130, 255, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(0, 200, 255, 0.12),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #03060b,
                    #07111e,
                    #03060b
                );

            color: #c8d1df;

            font-family:
                "Inter",
                "Segoe UI",
                system-ui,
                sans-serif;

            overflow-x: hidden;
        }

        /* Background glow */

        body::before,
        body::after {
            content: "";

            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.14;

            pointer-events: none;

            z-index: 0;

            animation: float 8s ease-in-out infinite alternate;
        }

        body::before {
            background: #008cff;

            top: -130px;
            left: -120px;
        }

        body::after {
            background: #00c8ff;

            right: -120px;
            bottom: -130px;

            animation-delay: 2s;
        }

        /* Brand */

        #brand {
            position: relative;
            z-index: 5;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 14px 10px;

            background: rgba(7, 12, 20, 0.82);

            border-bottom: 1px solid rgba(255, 255, 255, 0.07);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.2);
        }

        #brand::after {
            content: "";

            position: absolute;

            bottom: -1px;
            left: 25%;

            width: 50%;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                #008cff,
                transparent
            );

            box-shadow: 0 0 12px #008cff;
        }

        #brand b {
            font-size: 14px;
            font-weight: 700;

            letter-spacing: 0.13em;

            color: #e8f0fa;

            text-shadow:
                0 0 15px rgba(0, 150, 255, 0.18);
        }

        /* Spinner */

        #spin {
            position: fixed;

            top: calc(50% + 20px);
            left: 50%;

            width: 52px;
            height: 52px;

            margin: -26px 0 0 -26px;

            border: 4px solid rgba(255, 255, 255, 0.07);

            border-top-color: #168cff;
            border-right-color: #00c8ff;

            border-radius: 50%;

            box-shadow:
                0 0 20px rgba(0, 150, 255, 0.25);

            animation:
                spin 0.8s linear infinite,
                spinnerGlow 2s ease-in-out infinite;

            z-index: 2;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes spinnerGlow {
            0%,
            100% {
                filter: brightness(0.9);
            }

            50% {
                filter: brightness(1.35);
            }
        }

        /* Main message */

        #msg {
            position: fixed;

            top: 50%;
            left: 0;
            right: 0;

            transform: translateY(-50%);

            text-align: center;

            font-size: 15px;
            font-weight: 500;

            letter-spacing: 0.3px;

            color: #dbe8f7;

            display: none;

            z-index: 3;

            animation: messageIn 0.5s ease-out;
        }

        #msg::after {
            content: "...";

            display: inline-block;

            width: 18px;

            text-align: left;

            animation: dots 1.2s steps(4, end) infinite;
        }

        /* Main wrapper */

        #wrap {
            position: relative;
            z-index: 2;

            padding: 0;
        }

        #state,
        #out {
            display: none;
        }

        /* Done */

        body.done #spin {
            display: none;
        }

        /* Fail */

        body.fail #spin {
            display: none;
        }

        body.fail #msg {
            display: block;
        }

        /* Log */

        body.log #spin,
        body.log #msg {
            display: none;
        }

        body.log #wrap {
            padding: 20px;
        }

        body.log #state {
            display: block;

            margin: 0 0 12px;

            font-size: 21px;
            font-weight: 700;

            color: #e8f0fa;

            animation: logIn 0.45s ease-out;
        }

        body.log #out {
            display: block;

            white-space: pre-wrap;

            font:
                12px/1.6
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            color: #aebdce;

            background:
                linear-gradient(
                    135deg,
                    rgba(12, 19, 29, 0.92),
                    rgba(6, 11, 18, 0.92)
                );

            border: 1px solid rgba(255, 255, 255, 0.07);

            border-radius: 12px;

            padding: 15px;

            height: calc(100vh - 155px);

            overflow-y: auto;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35),
                0 0 30px rgba(0, 130, 255, 0.05);

            animation: logIn 0.5s ease-out;
        }

        /* Scrollbar */

        body.log #out::-webkit-scrollbar {
            width: 7px;
        }

        body.log #out::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        body.log #out::-webkit-scrollbar-thumb {
            background: #25374d;
            border-radius: 10px;
        }

        body.log #out::-webkit-scrollbar-thumb:hover {
            background: #315170;
        }

        /* Status colors */

        .ok,
        .safe {
            color: #63d99a;

            text-shadow:
                0 0 10px rgba(99, 217, 154, 0.15);
        }

        .bad,
        .danger {
            color: #ff6b73;

            text-shadow:
                0 0 10px rgba(255, 107, 115, 0.15);
        }

        .warn {
            color: #ffd166;

            text-shadow:
                0 0 10px rgba(255, 209, 102, 0.12);
        }

        code {
            color: #83b5ed;

            background: rgba(0, 120, 255, 0.06);

            padding: 2px 4px;

            border-radius: 4px;
        }

        /* Animations */

        @keyframes messageIn {
            from {
                opacity: 0;
                transform:
                    translateY(-45%);
            }

            to {
                opacity: 1;
                transform:
                    translateY(-50%);
            }
        }

        @keyframes logIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes dots {
            0% {
                content: "";
            }

            25% {
                content: ".";
            }

            50% {
                content: "..";
            }

            75%,
            100% {
                content: "...";
            }
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(35px, 25px);
            }
        }

        /* Mobile */

        @media (max-width: 600px) {

            #brand {
                padding: 12px 8px;
            }

            #brand b {
                font-size: 12px;
            }

            body.log #wrap {
                padding: 14px;
            }

            body.log #state {
                font-size: 18px;
            }

            body.log #out {
                font-size: 11px;
                padding: 12px;

                height: calc(100vh - 125px);
            }

            #msg {
                padding: 0 20px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div id="brand">
        <b>13.02-13.52 · PS4 Exploit</b>
    </div>

    <div id="spin"></div>

    <div id="msg">
        Tahan tombol PS &gt; Power &gt; Restart PS4
    </div>

    <div id="wrap">

        <div id="state"></div>

        <div id="out"></div>

    </div>

    <script type="module">
        import "./jb.js?v=10";
    </script>

</body>

</html>
