<html manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>13.02-13.52 · PS4 Exploit</title>
<style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        body {
            font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            /* Animated background */
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 150, 255, .30),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(120, 0, 255, .25),
                    transparent 35%
                ),
                linear-gradient(
                    -45deg,
                    #02040a,
                    #06182c,
                    #10052a,
                    #031821
                );
            background-size: 200% 200%;
            animation:
                backgroundMove 12s ease infinite;
        }
        @keyframes backgroundMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        /* =========================
           PARTICLES
        ========================== */
        .particles {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow:
                0 0 6px #00aaff,
                0 0 12px #0088ff;
            opacity: .7;
            animation:
                particleMove linear infinite;
        }
        @keyframes particleMove {
            from {
                transform:
                    translateY(110vh)
                    scale(.5);
                opacity: 0;
            }
            10% {
                opacity: .8;
            }
            90% {
                opacity: .8;
            }
            to {
                transform:
                    translateY(-10vh)
                    scale(1.2);
                opacity: 0;
            }
        }
        /* =========================
           GRID
        ========================== */
        .grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .12;
            background-image:
                linear-gradient(
                    rgba(0, 170, 255, .25) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 170, 255, .25) 1px,
                    transparent 1px
                );
            background-size: 40px 40px;
            transform:
                perspective(500px)
                rotateX(55deg)
                scale(1.8)
                translateY(25%);
            animation:
                gridMove 10s linear infinite;
            z-index: 1;
        }
        @keyframes gridMove {
            from {
                background-position:
                    0 0,
                    0 0;
            }
            to {
                background-position:
                    0 40px,
                    40px 0;
            }
        }
        /* =========================
           MAIN CARD
        ========================== */
        .card {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 560px;
            padding: 34px 28px;
            text-align: center;
            background:
                rgba(5, 10, 25, .76);
            backdrop-filter:
                blur(16px);
            -webkit-backdrop-filter:
                blur(16px);
            border:
                1px solid
                rgba(0, 174, 255, .35);
            border-radius: 20px;
            box-shadow:
                0 0 20px
                rgba(0, 140, 255, .12),
                0 0 60px
                rgba(0, 80, 255, .10),
                inset 0 0 25px
                rgba(0, 150, 255, .04);
            animation:
                cardFloat 4s ease-in-out infinite;
        }
        @keyframes cardFloat {
            0%,
            100% {
                transform:
                    translateY(0);
            }
            50% {
                transform:
                    translateY(-6px);
            }
        }
        /* =========================
           HEADER
        ========================== */
        .logo {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow:
                0 0 5px #00aaff,
                0 0 15px #0088ff,
                0 0 30px #0055ff;
        }
        .version {
            display: inline-block;
            padding: 6px 14px;
            margin-bottom: 25px;
            border-radius: 20px;
            font-size: .65rem;
            letter-spacing: 2px;
            color: #00c8ff;
            background:
                rgba(0, 150, 255, .08);
            border:
                1px solid
                rgba(0, 180, 255, .3);
            box-shadow:
                0 0 15px
                rgba(0, 160, 255, .1);
        }
        /* =========================
           LOADER
        ========================== */
        #loader {
            width: 45px;
            height: 45px;
            margin:
                0 auto 20px;
            border:
                3px solid
                rgba(255,255,255,.12);
            border-top:
                3px solid
                #00aaff;
            border-right:
                3px solid
                #7b00ff;
            border-radius: 50%;
            animation:
                spin 1s linear infinite;
            box-shadow:
                0 0 15px
                rgba(0,150,255,.4);
        }
        @keyframes spin {
            to {
                transform:
                    rotate(360deg);
            }
        }
        /* =========================
           CONSOLE
        ========================== */
        #console {
            width: 100%;
            min-height: 150px;
            padding: 18px;
            margin-top: 5px;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
            font-family:
                "Cascadia Code", "Segoe UI", system-ui, sans-serif;
            font-size: .72rem;
            line-height: 1.8;
            color: #9eb6ca;
            background:
                rgba(0,0,0,.35);
            border:
                1px solid
                rgba(255,255,255,.08);
            border-radius: 12px;
            box-shadow:
                inset 0 0 20px
                rgba(0,0,0,.25);
        }
        /* Status colors */
        .ok {
            color: #00e676;
            text-shadow:
                0 0 8px
                rgba(0,230,118,.7);
        }
        .bad {
            color: #ff4d6d;
            text-shadow:
                0 0 8px
                rgba(255,0,60,.7);
        }
        .warn {
            color: #ffc107;
            text-shadow:
                0 0 8px
                rgba(255,180,0,.6);
        }
        /* =========================
           FOOTER
        ========================== */
        .footer {
            margin-top: 20px;
            font-size: .55rem;
            letter-spacing: 2px;
            color: #52677d;
        }

        /* =========================
           PROCESS ANIMATION
        ========================== */

        #console {
            transition:
                opacity .25s ease,
                transform .25s ease;
        }

        #console span {
            display: block;
            animation:
                processIn .42s cubic-bezier(.2,.8,.2,1) both;
        }

        @keyframes processIn {
            from {
                opacity: 0;
                transform: translateX(-12px);
                filter: blur(3px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
                filter: blur(0);
            }
        }

        #process {
            width: 100%;
            height: 5px;
            margin: 0 0 15px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255,255,255,.07);
            box-shadow: inset 0 0 8px rgba(0,0,0,.45);
        }

        #processBar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg,#00aaff,#7b4dff);
            box-shadow: 0 0 12px rgba(0,170,255,.65);
            transition: width .35s ease;
            position: relative;
        }

        #processBar::after {
            content: "";
            position: absolute;
            top: 0;
            left: -35px;
            width: 35px;
            height: 100%;
            background: rgba(255,255,255,.75);
            filter: blur(5px);
            animation: progressSweep 1.2s linear infinite;
        }

        @keyframes progressSweep {
            from { left: -35px; }
            to { left: 100%; }
        }

        .statusPulse {
            animation: statusPulse .45s ease both;
        }

        @keyframes statusPulse {
            from {
                opacity: .2;
                transform: scale(.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .readyGlow {
            animation: readyGlow 1.1s ease both;
        }

        @keyframes readyGlow {
            0% {
                box-shadow:
                    0 0 0 rgba(0,230,118,0);
            }
            45% {
                box-shadow:
                    0 0 28px rgba(0,230,118,.25);
            }
            100% {
                box-shadow:
                    0 0 10px rgba(0,230,118,.08);
            }
        }

        /* =========================
           MOBILE
        ========================== */
        @media (max-width: 500px) {
            .card {
                padding:
                    28px 18px;
            }
            .logo {
                font-size:
                    1.25rem;
                letter-spacing:
                    3px;
            }
            #console {
                font-size:
                    .62rem;
                min-height:
                    140px;
            }
        }
    </style>
    <script>
        if (
            window.applicationCache &&
            window.applicationCache.status == 0
        ) {
            window.location.replace(
                "cache.html"
            );
        }
    </script>
</head>
<body>
    <!-- Animated background -->
    <div class="particles">
        <span class="particle"
              style="left:5%;animation-duration:8s;"></span>
        <span class="particle"
              style="left:12%;animation-duration:12s;"></span>
        <span class="particle"
              style="left:20%;animation-duration:10s;"></span>
        <span class="particle"
              style="left:28%;animation-duration:15s;"></span>
        <span class="particle"
              style="left:37%;animation-duration:9s;"></span>
        <span class="particle"
              style="left:45%;animation-duration:13s;"></span>
        <span class="particle"
              style="left:53%;animation-duration:11s;"></span>
        <span class="particle"
              style="left:61%;animation-duration:14s;"></span>
        <span class="particle"
              style="left:70%;animation-duration:10s;"></span>
        <span class="particle"
              style="left:78%;animation-duration:16s;"></span>
        <span class="particle"
              style="left:87%;animation-duration:12s;"></span>
        <span class="particle"
              style="left:95%;animation-duration:9s;"></span>
    </div>
    <!-- Animated grid -->
    <div class="grid"></div>
    <!-- Main -->
    <div class="card">
        <div class="logo">
            PS4 EXPLOIT
        </div>
        <div class="version">
            FIRMWARE 13.02 — 13.52
        </div>
        <div id="loader"></div>
        <div id="process"><div id="processBar"></div></div>
        <pre id="console"></pre>
        <div class="footer">
            SYSTEM READY • OFFLINE CACHE ENABLED
        </div>
    </div>
<script>
(function () {
    var con =
        document.getElementById(
            "console"
        );
    var loader =
        document.getElementById(
            "loader"
        );

    var process =
        document.getElementById(
            "process"
        );

    var processBar =
        document.getElementById(
            "processBar"
        );

    var stepCount = 0;
    function print(msg, cls) {
        var span =
            document.createElement(
                "span"
            );

        if (cls)
            span.className = cls;

        span.textContent =
            msg;

        con.appendChild(span);

        stepCount++;

        /*
         * Smooth visual progress.
         * It is intentionally UI-only and does not
         * control the exploit flow.
         */
        var pct =
            Math.min(
                94,
                8 + stepCount * 9
            );

        processBar.style.width =
            pct + "%";

        span.classList.add(
            "statusPulse"
        );

        con.scrollTop =
            con.scrollHeight;
    }
    var params =
        new URLSearchParams(
            location.search
        );
    /*
     * Firmware table
     * KEEP IN SYNC with ps4_offsets.js
     */
    var SUPPORTED = {
        1302: 1,
        1304: 1,
        1350: 1,
        1352: 1
    };
    var key = null;
    var fwnum = null;
    var m =
        /PlayStation\s+4[\/ ](\d+)\.(\d+)/
        .exec(
            navigator.userAgent
        );
    if (m) {
        var ms =
            parseInt(
                m[2],
                16
            ).toString(16);
        if (ms.length < 2)
            ms = "0" + ms;
        key =
            m[1] +
            "." +
            ms;
        fwnum =
            parseInt(
                m[1],
                10
            ) * 100
            +
            parseInt(
                ms,
                10
            );
    }
    var forced =
        params.get("force") === "1";
    var supported =
        forced ||
        (
            fwnum !== null &&
            SUPPORTED[fwnum] === 1
        );
    print(
        "firmware: " +
        (key || "unknown")
    );
    print(
        "supported: " +
        (supported ? "yes" : "no"),
        supported
            ? "ok"
            : "bad"
    );
    var target =
        "jb.html" +
        location.search;
    function go() {
        print(
            "loading exploit...",
            "warn"
        );
        setTimeout(
            function () {
                location.replace(
                    target
                );
            },
            500
        );
    }
    function waitForTap(
        msg,
        action
    ) {
        print(
            msg,
            "warn"
        );
        function fire() {
            window.removeEventListener(
                "click",
                fire
            );
            window.removeEventListener(
                "keydown",
                fire
            );
            action();
        }
        window.addEventListener(
            "click",
            fire
        );
        window.addEventListener(
            "keydown",
            fire
        );
    }
    /*
     * Unsupported device
     */
    if (!supported) {
        loader.style.display =
            "none";
        process.style.opacity = ".45";
        print(
            "Perangkat ini bukan PS4 Bro",
            "bad"
        );
        waitForTap(
            "Press X/O untuk melanjutkan",
            go
        );
        return;
    }
    var ac =
        window.applicationCache;
    /*
     * Application cache unavailable
     */
    if (
        !ac ||
        !document.documentElement
            .hasAttribute(
                "manifest"
            )
    ) {
        loader.style.display =
            "none";
        go();
    }
    /*
     * Offline
     */
    else if (
        !navigator.onLine
    ) {
        loader.style.display =
            "none";
        processBar.style.width = "100%";
        process.classList.add("readyGlow");
        print(
            "offline — running from cache",
            "ok"
        );
        go();
    }
    /*
     * Cache ready
     */
    else if (
        ac.status ===
        ac.IDLE
    ) {
        loader.style.display =
            "none";
        processBar.style.width = "100%";
        process.classList.add("readyGlow");
        print(
            "cached",
            "ok"
        );
        go();
    }
    /*
     * Update ready
     */
    else if (
        ac.status ===
        ac.UPDATEREADY
    ) {
        loader.style.display =
            "none";
        try {
            ac.swapCache();
        } catch (e) {}
        print(
            "update downloaded",
            "ok"
        );
        waitForTap(
            "UPDATE READY — Press X/O to reload",
            function () {
                location.reload();
            }
        );
    }
    /*
     * Cache process
     */
    else {
        print(
            "checking cache..."
        );
        ac.addEventListener(
            "downloading",
            function () {
                print(
                    "caching for offline (first run)..."
                );
            },
            false
        );
        ac.addEventListener(
            "progress",
            function (e) {
                if (
                    e &&
                    e.total
                ) {
                    print(
                        "caching " +
                        Math.round(
                            (
                                e.loaded /
                                e.total
                            ) * 100
                        ) +
                        "%"
                    );
                }
            },
            false
        );
        ac.addEventListener(
            "cached",
            function () {
                loader.style.display =
                    "none";
                processBar.style.width = "100%";
                process.classList.add("readyGlow");
                print(
                    "cached for offline use",
                    "ok"
                );
                waitForTap(
                    "CACHED — Press X/O to run",
                    go
                );
            },
            false
        );
        ac.addEventListener(
            "updateready",
            function () {
                loader.style.display =
                    "none";
                try {
                    ac.swapCache();
                } catch (e) {}
                print(
                    "update downloaded",
                    "ok"
                );
                waitForTap(
                    "UPDATE READY — Press X/O to reload",
                    function () {
                        location.reload();
                    }
                );
            },
            false
        );
        ac.addEventListener(
            "noupdate",
            function () {
                loader.style.display =
                    "none";
                processBar.style.width = "100%";
                process.classList.add("readyGlow");
                print(
                    "cached — offline ready",
                    "ok"
                );
                go();
            },
            false
        );
        ac.addEventListener(
            "error",
            function () {
                loader.style.display =
                    "none";
                process.style.opacity = ".45";
                print(
                    "cache unavailable",
                    "bad"
                );
                waitForTap(
                    "CACHE FAILED — Press X/O to run anyway",
                    go
                );
            },
            false
        );
        ac.addEventListener(
            "obsolete",
            function () {
                loader.style.display =
                    "none";
                process.style.opacity = ".55";
                print(
                    "cache obsolete",
                    "warn"
                );
                waitForTap(
                    "CACHE OBSOLETE — Press X/O to run",
                    go
                );
            },
            false
        );
    }
})();
</script>
</body>
</html>
