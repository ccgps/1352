<!DOCTYPE html>
<html lang="id" manifest="cache.appcache">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>13.02-13.52 · PS4 Exploit</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            overflow: hidden;

            color: #dce6f2;

            font-family:
                "Inter",
                "Segoe UI",
                system-ui,
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(0, 132, 255, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(0, 200, 255, 0.13),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #03060b,
                    #07111f,
                    #03060b
                );
        }

        /* Background glow */

        body::before,
        body::after {
            content: "";

            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.16;

            pointer-events: none;

            animation: float 8s ease-in-out infinite alternate;
        }

        body::before {
            background: #008cff;

            top: -130px;
            left: -120px;
        }

        body::after {
            background: #00c8ff;

            right: -130px;
            bottom: -130px;

            animation-delay: 2s;
        }

        /* Main card */

        .card {
            width: min(100%, 620px);

            position: relative;
            z-index: 2;

            padding: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(14, 22, 34, 0.92),
                    rgba(6, 11, 18, 0.92)
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 18px;

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55),
                0 0 45px rgba(0, 130, 255, 0.08);

            animation: cardIn 0.7s ease-out;
        }

        /* Top glow */

        .card::before {
            content: "";

            position: absolute;

            top: -1px;
            left: 15%;

            width: 70%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #008cff,
                    transparent
                );

            box-shadow:
                0 0 15px #008cff;
        }

        /* Header */

        .header {
            display: flex;
            align-items: center;

            gap: 14px;

            margin-bottom: 22px;
        }

        .logo {
            width: 48px;
            height: 48px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            font-size: 14px;
            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #087fff,
                    #00bfff
                );

            box-shadow:
                0 0 25px
                rgba(0, 150, 255, 0.30);

            animation: pulse 2.5s ease-in-out infinite;
        }

        .title {
            color: #edf5ff;

            font-size: 16px;
            font-weight: 600;
        }

        .subtitle {
            margin-top: 4px;

            color: #65758a;

            font-size: 11px;
        }

        /* Terminal */

        .terminal {
            overflow: hidden;

            background:
                rgba(3, 7, 12, 0.70);

            border:
                1px solid
                rgba(255, 255, 255, 0.07);

            border-radius: 12px;

            box-shadow:
                inset 0 1px 0
                rgba(255, 255, 255, 0.02);
        }

        .terminal-bar {
            height: 38px;

            display: flex;
            align-items: center;

            padding: 0 13px;

            background:
                rgba(255, 255, 255, 0.025);

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.06);
        }

        .dot {
            width: 8px;
            height: 8px;

            margin-right: 6px;

            border-radius: 50%;

            background: #344154;
        }

        .terminal-name {
            margin-left: 8px;

            color: #53647a;

            font:
                10px
                "SFMono-Regular",
                Consolas,
                monospace;
        }

        /* Console */

        #console {
            min-height: 220px;

            margin: 0;

            padding: 18px;

            white-space: pre-wrap;
            word-break: break-word;

            color: #aebdce;

            font:
                13px/1.7
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;
        }

        #console span {
            display: block;

            animation: lineIn 0.25s ease-out;
        }

        #console span::before {
            content: "> ";

            color: #3f607e;
        }

        .ok {
            color: #63d99a;

            text-shadow:
                0 0 10px
                rgba(99, 217, 154, 0.16);
        }

        .bad {
            color: #ff6b73;

            text-shadow:
                0 0 10px
                rgba(255, 107, 115, 0.14);
        }

        .warn {
            color: #ffd166;

            text-shadow:
                0 0 10px
                rgba(255, 209, 102, 0.12);
        }

        /* Loading */

        .loading {
            display: flex;
            align-items: center;

            gap: 9px;

            margin-top: 18px;

            color: #63758b;

            font-size: 11px;
        }

        .loading-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #168cff;

            box-shadow:
                0 0 10px
                rgba(0, 150, 255, 0.55);

            animation: blink 1.2s ease-in-out infinite;
        }

        /* Animations */

        @keyframes cardIn {
            from {
                opacity: 0;
                transform:
                    translateY(20px)
                    scale(0.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes lineIn {
            from {
                opacity: 0;
                transform: translateX(-5px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                box-shadow:
                    0 0 20px
                    rgba(0, 140, 255, 0.25);
            }

            50% {
                box-shadow:
                    0 0 35px
                    rgba(0, 180, 255, 0.45);
            }
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(35px, 25px);
            }
        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 14px;
            }

            .card {
                padding: 22px 18px;
                border-radius: 16px;
            }

            .header {
                margin-bottom: 18px;
            }

            .logo {
                width: 43px;
                height: 43px;
            }

            .title {
                font-size: 14px;
            }

            #console {
                min-height: 210px;

                padding: 15px;

                font-size: 11px;
                line-height: 1.65;
            }
        }
    </style>

    <script>
        if (
            window.applicationCache &&
            window.applicationCache.status == 0
        ) {
            window.location.replace("cache.html");
        }
    </script>
</head>

<body>

    <div class="card">

        <div class="header">

            <div class="logo">
                PS4
            </div>

            <div>
                <div class="title">
                    PS4 Exploit Loader
                </div>

                <div class="subtitle">
                    Firmware 13.02 — 13.52
                </div>
            </div>

        </div>

        <div class="terminal">

            <div class="terminal-bar">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

                <span class="terminal-name">
                    firmware-check
                </span>

            </div>

            <pre id="console"></pre>

        </div>

        <div class="loading">
            <span class="loading-dot"></span>
            Checking system cache...
        </div>

    </div>

<script>
(function () {

    var con = document.getElementById("console");

    function print(msg, cls) {

        var span =
            document.createElement("span");

        if (cls)
            span.className = cls;

        span.textContent = msg;

        con.appendChild(span);
    }

    var params =
        new URLSearchParams(location.search);

    // Firmwares with measured kernel table
    // KEEP IN SYNC with ps4_offsets.js

    var SUPPORTED = {
        1302: 1,
        1304: 1,
        1350: 1,
        1352: 1
    };

    var key = null;
    var fwnum = null;

    var m =
        /PlayStation\s+4[\/ ](\d+)\.(\d+)/
        .exec(navigator.userAgent);

    if (m) {

        var ms =
            parseInt(m[2], 16)
            .toString(16);

        if (ms.length < 2)
            ms = "0" + ms;

        key =
            m[1] + "." + ms;

        fwnum =
            parseInt(m[1], 10) * 100 +
            parseInt(ms, 10);
    }

    var forced =
        params.get("force") === "1";

    var supported =
        forced ||
        (
            fwnum !== null &&
            SUPPORTED[fwnum] === 1
        );

    print(
        "firmware: " +
        (key || "unknown")
    );

    print(
        "supported: " +
        (supported ? "yes" : "no"),
        supported ? "ok" : "bad"
    );

    var target =
        "jb.html" + location.search;

    function go() {

        print(
            "loading exploit...",
            "warn"
        );

        location.replace(target);
    }

    function waitForTap(msg, action) {

        print(msg, "warn");

        function fire() {

            window.removeEventListener(
                "click",
                fire
            );

            window.removeEventListener(
                "keydown",
                fire
            );

            action();
        }

        window.addEventListener(
            "click",
            fire
        );

        window.addEventListener(
            "keydown",
            fire
        );
    }

    if (!supported) {

        print(
            "Perangkat ini bukan PS4 Bro",
            "bad"
        );

        waitForTap("", go);

        return;
    }

    var ac =
        window.applicationCache;

    if (
        !ac ||
        !document.documentElement
            .hasAttribute("manifest")
    ) {

        go();

    } else if (!navigator.onLine) {

        print(
            "offline — running from cache",
            "ok"
        );

        go();

    } else if (ac.status === ac.IDLE) {

        print(
            "cached",
            "ok"
        );

        go();

    } else if (ac.status === ac.UPDATEREADY) {

        try {
            ac.swapCache();
        } catch (e) {}

        print(
            "update downloaded",
            "ok"
        );

        waitForTap(
            "UPDATE READY — Press X/O to reload",
            function () {
                location.reload();
            }
        );

    } else {

        print(
            "checking cache..."
        );

        ac.addEventListener(
            "downloading",
            function () {

                print(
                    "caching for offline (first run)..."
                );

            },
            false
        );

        ac.addEventListener(
            "progress",
            function (e) {

                if (e && e.total) {

                    print(
                        "caching " +
                        Math.round(
                            (e.loaded / e.total) * 100
                        ) +
                        "%"
                    );
                }

            },
            false
        );

        ac.addEventListener(
            "cached",
            function () {

                print(
                    "cached for offline use",
                    "ok"
                );

                waitForTap(
                    "CACHED — Press X/O to run",
                    go
                );

            },
            false
        );

        ac.addEventListener(
            "updateready",
            function () {

                try {
                    ac.swapCache();
                } catch (e) {}

                print(
                    "update downloaded",
                    "ok"
                );

                waitForTap(
                    "UPDATE READY — Press X/O to reload",
                    function () {
                        location.reload();
                    }
                );

            },
            false
        );

        ac.addEventListener(
            "noupdate",
            function () {

                print(
                    "cached — offline ready",
                    "ok"
                );

                go();

            },
            false
        );

        ac.addEventListener(
            "error",
            function () {

                print(
                    "cache unavailable"
                );

                waitForTap(
                    "CACHE FAILED — Press X/O to run anyway",
                    go
                );

            },
            false
        );

        ac.addEventListener(
            "obsolete",
            function () {

                print(
                    "cache obsolete"
                );

                waitForTap(
                    "CACHE OBSOLETE — Press X/O to run",
                    go
                );

            },
            false
        );
    }

})();
</script>

</body>
</html>
