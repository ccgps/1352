<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PS4 Lapse · 11.50–13.00</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
    --bg: #02050b;
    --panel: rgba(6, 16, 30, 0.80);
    --border: rgba(100, 170, 255, 0.16);

    --text: #e4efff;
    --muted: #71859e;

    --blue: #3c9cff;
    --blue-light: #8ec8ff;

    --green: #58dc91;
    --red: #ff6878;
    --yellow: #ffc967;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    overflow: hidden;

    color: var(--text);

    font:
        15px/1.45
        "Inter",
        "Segoe UI",
        system-ui,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(0, 120, 255, 0.16),
            transparent 34%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(0, 75, 190, 0.10),
            transparent 36%
        ),
        linear-gradient(
            135deg,
            #02050b 0%,
            #061222 50%,
            #02050b 100%
        );
}

/* Ambient glow */

body::before {
    content: "";

    position: fixed;

    width: 440px;
    height: 440px;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(0, 110, 255, 0.065);

    filter: blur(95px);

    pointer-events: none;

    animation: ambient 5s ease-in-out infinite;
}

/* Header */

#brand {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 66px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(4, 10, 19, 0.80);

    border-bottom: 1px solid var(--border);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    z-index: 10;
}

#brand::after {
    content: "";

    position: absolute;

    bottom: -1px;
    left: 50%;

    width: 130px;
    height: 1px;

    transform: translateX(-50%);

    background: var(--blue);

    box-shadow:
        0 0 15px rgba(50, 150, 255, 0.75);
}

#brand img {
    width: 34px;
    height: 34px;

    margin-right: 11px;

    border-radius: 10px;

    object-fit: cover;

    border: 1px solid rgba(100, 175, 255, 0.20);

    box-shadow:
        0 0 18px rgba(0, 110, 255, 0.13);
}

#brand b {
    color: #edf6ff;

    font-size: 15px;
    font-weight: 700;

    letter-spacing: 0.12em;

    text-shadow:
        0 0 18px rgba(70, 160, 255, 0.25);
}

/* Main panel */

#wrap {
    position: absolute;

    top: 50%;
    left: 50%;

    width: min(92%, 900px);

    transform: translate(-50%, -43%);

    padding: 27px;

    background:
        linear-gradient(
            145deg,
            rgba(8, 19, 35, 0.84),
            rgba(3, 9, 18, 0.76)
        );

    border: 1px solid var(--border);

    border-radius: 22px;

    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.52),
        0 0 50px rgba(0, 100, 255, 0.06);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    animation: cardIn 0.65s ease-out;
}

/* State */

#state {
    margin: 0 0 16px;

    color: #eef7ff;

    font-size: 22px;
    font-weight: 700;

    letter-spacing: -0.2px;

    text-shadow:
        0 0 20px rgba(60, 155, 255, 0.12);
}

/* Terminal */

#out {
    width: 100%;
    height: calc(100vh - 205px);

    min-height: 260px;

    overflow-y: auto;

    padding: 17px 18px;

    white-space: pre-wrap;
    word-break: break-word;

    color: #91a8c1;

    font:
        12px/1.7
        "JetBrains Mono",
        Consolas,
        monospace;

    background:
        linear-gradient(
            145deg,
            rgba(2, 8, 16, 0.94),
            rgba(1, 5, 11, 0.92)
        );

    border: 1px solid rgba(100, 160, 220, 0.13);

    border-radius: 15px;

    box-shadow:
        inset 0 0 35px rgba(0, 70, 160, 0.025),
        0 15px 35px rgba(0, 0, 0, 0.25);

    scrollbar-width: thin;
    scrollbar-color: #263d58 transparent;
}

#out::-webkit-scrollbar {
    width: 6px;
}

#out::-webkit-scrollbar-track {
    background: transparent;
}

#out::-webkit-scrollbar-thumb {
    background: #263d58;
    border-radius: 10px;
}

/* Status colors */

.ok {
    color: var(--green);
}

.bad {
    color: var(--red);
}

.warn {
    color: var(--yellow);
}

/* Terminal scan effect */

#out::after {
    content: "";

    position: fixed;

    pointer-events: none;
}

/* Animations */

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translate(-50%, -40%) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -43%) scale(1);
    }
}

@keyframes ambient {
    0%,
    100% {
        opacity: 0.4;
        transform: translate(-50%, -50%) scale(1);
    }

    50% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1.12);
    }
}

/* Mobile */

@media (max-width: 600px) {

    #brand {
        height: 58px;
    }

    #brand img {
        width: 30px;
        height: 30px;

        margin-right: 8px;
    }

    #brand b {
        font-size: 12px;
        letter-spacing: 0.07em;
    }

    #wrap {
        width: 92%;

        padding: 20px;

        border-radius: 18px;
    }

    #state {
        font-size: 18px;
        margin-bottom: 12px;
    }

    #out {
        height: calc(100vh - 175px);

        min-height: 220px;

        padding: 14px;

        font-size: 10.5px;
        line-height: 1.65;

        border-radius: 12px;
    }
}
</style>
</head>

<body>

<div id="brand">
    <img
        src="ccg.png"
        alt=""
        width="34"
        height="34"
    >

    <b>PS4 JAILBREAK 11.50–13.00</b>
</div>

<div id="wrap">

    <div id="state">
        loading lapse chain...
    </div>

    <div id="out"></div>

</div>

<script type="module">
    import "./chain_lapse.js";
</script>

</body>
</html>
