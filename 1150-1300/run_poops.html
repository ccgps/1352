<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>PS4 Poops Chain</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050914;
      --bg2: #091224;
      --panel: rgba(10, 18, 34, 0.82);
      --panel-soft: rgba(15, 27, 48, 0.72);
      --border: rgba(92, 145, 210, 0.20);
      --border-bright: rgba(90, 160, 255, 0.35);
      --text: #edf5ff;
      --muted: #8ea0b8;
      --blue: #4da3ff;
      --blue-soft: rgba(77, 163, 255, 0.16);
      --green: #65e6a1;
      --red: #ff7180;
      --yellow: #ffd166;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font: 15px/1.5 "Inter", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(42, 116, 220, 0.24),
          transparent 42%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(25, 82, 160, 0.13),
          transparent 38%
        ),
        linear-gradient(145deg, var(--bg), var(--bg2));

      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        );
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
      opacity: .35;
    }

    #brand {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      min-height: 58px;
      padding: 10px 18px;

      background: rgba(5, 10, 20, 0.72);
      border-bottom: 1px solid var(--border);

      box-shadow:
        0 1px 0 rgba(255,255,255,.025),
        0 8px 30px rgba(0,0,0,.22);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    #brand img {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;

      border-radius: 50%;

      box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 0 20px rgba(77,163,255,.22);

      vertical-align: middle;
    }

    #brand b {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .16em;
      color: #f1f7ff;
      text-align: center;
    }

    #wrap {
      position: relative;
      z-index: 1;

      width: min(1100px, calc(100% - 28px));
      margin: 26px auto;
      padding: 22px;

      background: linear-gradient(
        145deg,
        rgba(16, 29, 51, 0.84),
        rgba(7, 14, 27, 0.86)
      );

      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, .38),
        inset 0 1px 0 rgba(255,255,255,.035);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      animation: panelIn .45s ease-out both;
    }

    #state {
      position: relative;

      display: flex;
      align-items: center;
      gap: 12px;

      margin: 0 0 16px;
      padding: 2px 2px 16px;

      font-size: clamp(19px, 3vw, 25px);
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--text);

      border-bottom: 1px solid rgba(100, 150, 210, .12);
    }

    #state::before {
      content: "";

      width: 9px;
      height: 9px;
      flex: 0 0 9px;

      border-radius: 50%;
      background: var(--blue);

      box-shadow:
        0 0 0 5px rgba(77,163,255,.08),
        0 0 18px rgba(77,163,255,.75);

      animation: pulse 1.7s ease-in-out infinite;
    }

    #out {
      position: relative;

      white-space: pre-wrap;
      word-break: break-word;

      height: calc(100vh - 190px);
      min-height: 280px;
      max-height: 760px;

      overflow-y: auto;
      overflow-x: hidden;

      padding: 16px 17px;

      color: #b9c9dc;

      font: 13px/1.65 "JetBrains Mono", Consolas, monospace;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(45, 115, 205, .07),
          transparent 55%
        ),
        rgba(3, 9, 18, .78);

      border: 1px solid rgba(82, 137, 201, .18);
      border-radius: 12px;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.025),
        inset 0 0 35px rgba(0,0,0,.22);

      scrollbar-width: thin;
      scrollbar-color: rgba(77,163,255,.35) transparent;
    }

    #out::-webkit-scrollbar {
      width: 7px;
    }

    #out::-webkit-scrollbar-track {
      background: transparent;
    }

    #out::-webkit-scrollbar-thumb {
      background: rgba(77,163,255,.32);
      border-radius: 20px;
    }

    #out::-webkit-scrollbar-thumb:hover {
      background: rgba(77,163,255,.55);
    }

    .ok {
      color: var(--green);
    }

    .bad {
      color: var(--red);
    }

    .warn {
      color: var(--yellow);
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: .65;
        transform: scale(.88);
        box-shadow:
          0 0 0 5px rgba(77,163,255,.06),
          0 0 12px rgba(77,163,255,.45);
      }

      50% {
        opacity: 1;
        transform: scale(1);
        box-shadow:
          0 0 0 6px rgba(77,163,255,.10),
          0 0 22px rgba(77,163,255,.85);
      }
    }

    @media (max-width: 700px) {
      #brand {
        min-height: 52px;
        padding: 9px 12px;
      }

      #brand img {
        width: 27px;
        height: 27px;
        flex-basis: 27px;
      }

      #brand b {
        font-size: 11px;
        letter-spacing: .11em;
      }

      #wrap {
        width: calc(100% - 18px);
        margin: 14px auto;
        padding: 15px;
        border-radius: 14px;
      }

      #state {
        font-size: 18px;
        margin-bottom: 13px;
        padding-bottom: 13px;
      }

      #out {
        height: calc(100vh - 155px);
        min-height: 250px;
        padding: 13px;
        font-size: 12px;
        line-height: 1.6;
        border-radius: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #wrap,
      #state::before {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div id="brand">
    <img src="ccg.png" alt="" width="28" height="28">
    <b>PS4 JAILBREAK 11.50–13.00</b>
  </div>

  <div id="wrap">
    <div id="state">loading poops chain...</div>
    <div id="out"></div>
  </div>

  <script type="module">
    import "./chain_poops.js";
  </script>

</body>
</html>
