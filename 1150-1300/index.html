<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PS4 Jailbreak 11.50–13.00</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
    --bg: #02050b;
    --panel: rgba(7, 17, 31, 0.78);
    --panel2: rgba(3, 9, 18, 0.72);
    --border: rgba(100, 170, 255, 0.16);

    --text: #e6f1ff;
    --muted: #70849d;

    --blue: #3b9cff;
    --blue-light: #91cbff;

    --green: #58dc91;
    --red: #ff6878;
    --yellow: #ffc967;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    overflow: hidden;

    color: var(--text);

    font:
        15px/1.45
        "Inter",
        "Segoe UI",
        system-ui,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(0, 120, 255, 0.17),
            transparent 34%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(0, 75, 190, 0.11),
            transparent 36%
        ),
        linear-gradient(
            135deg,
            #02050b 0%,
            #061222 50%,
            #02050b 100%
        );
}

/* Ambient background glow */

body::before {
    content: "";

    position: fixed;

    width: 440px;
    height: 440px;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(0, 110, 255, 0.07);

    filter: blur(95px);

    pointer-events: none;

    animation: ambient 5s ease-in-out infinite;
}

/* Header */

#brand {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 72px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(4, 10, 19, 0.78);

    border-bottom: 1px solid var(--border);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    z-index: 10;
}

#brand::after {
    content: "";

    position: absolute;

    bottom: -1px;
    left: 50%;

    width: 150px;
    height: 1px;

    transform: translateX(-50%);

    background: var(--blue);

    box-shadow:
        0 0 14px rgba(50, 150, 255, 0.75);
}

#brand img {
    width: 38px;
    height: 38px;

    margin-right: 13px;

    border-radius: 11px;

    object-fit: cover;

    border: 1px solid rgba(100, 175, 255, 0.2);

    box-shadow:
        0 0 20px rgba(0, 110, 255, 0.14);
}

#brand b {
    color: #edf6ff;

    font-size: 18px;
    font-weight: 700;

    letter-spacing: 0.08em;

    text-shadow:
        0 0 18px rgba(80, 160, 255, 0.25);
}

/* Main content */

#wrap {
    position: absolute;

    top: 50%;
    left: 50%;

    width: min(92%, 820px);

    transform: translate(-50%, -42%);

    padding: 34px;

    background:
        linear-gradient(
            145deg,
            rgba(8, 19, 35, 0.84),
            rgba(3, 9, 18, 0.76)
        );

    border: 1px solid var(--border);

    border-radius: 24px;

    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.52),
        0 0 50px rgba(0, 100, 255, 0.06);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    animation: cardIn 0.65s ease-out;
}

/* Firmware state */

#state {
    margin: 0 0 10px;

    color: #eef7ff;

    font-size: 34px;
    font-weight: 700;

    letter-spacing: -0.6px;

    text-shadow:
        0 0 25px rgba(60, 155, 255, 0.12);
}

/* Firmware details */

#det {
    margin: 0 0 8px;

    color: var(--muted);

    font:
        13px/1.7
        "JetBrains Mono",
        Consolas,
        monospace;

    word-break: break-word;
}

#det b {
    color: #d9eaff;

    font-weight: 500;
}

/* Cache status */

#cache {
    min-height: 20px;

    margin: 0 0 16px;

    color: #526982;

    font:
        12px/1.5
        "JetBrains Mono",
        Consolas,
        monospace;

    transition:
        color 0.25s ease,
        opacity 0.25s ease;
}

#cache.cacheok {
    color: var(--green);

    text-shadow:
        0 0 12px rgba(80, 220, 145, 0.18);
}

/* Status colors */

.ok {
    color: var(--green);
}

.bad {
    color: var(--red);
}

.warn {
    color: var(--yellow);
}

/* Status line */

#wrap::after {
    content: "SYSTEM COMPATIBILITY CHECK";

    display: block;

    padding-top: 17px;

    border-top: 1px solid rgba(100, 160, 220, 0.09);

    color: #435972;

    font-size: 9px;
    font-weight: 600;

    letter-spacing: 1.8px;
}

/* Animations */

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translate(-50%, -39%) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -42%) scale(1);
    }
}

@keyframes ambient {
    0%,
    100% {
        opacity: 0.45;
        transform: translate(-50%, -50%) scale(1);
    }

    50% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1.12);
    }
}

/* Mobile */

@media (max-width: 600px) {

    #brand {
        height: 62px;
    }

    #brand img {
        width: 32px;
        height: 32px;

        margin-right: 9px;
    }

    #brand b {
        font-size: 13px;
        letter-spacing: 0.05em;
    }

    #wrap {
        width: 92%;

        padding: 25px 22px;

        border-radius: 19px;
    }

    #state {
        font-size: 25px;
    }

    #det {
        font-size: 11px;
        line-height: 1.65;
    }

    #cache {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div id="brand">
    <img
        src="ccg.png"
        alt=""
        width="38"
        height="38"
    >

    <b>PS4 JAILBREAK 11.50–13.00</b>
</div>

<div id="wrap">

    <div id="state">
        mendeteksi firmware...
    </div>

    <div id="det"></div>

    <div id="cache"></div>

</div>

<script>
(function () {

    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");

    function setState(t, c) {
        stateEl.textContent = t;
        stateEl.className = c || "";
    }

    function setCache(t, ok) {
        cacheEl.textContent = t;
        cacheEl.className = ok ? "cacheok" : "";
    }

    var params = new URLSearchParams(location.search);

    var key = null;
    var fwnum = null;

    var m =
        /PlayStation\s+4[\/ ](\d+)\.(\d+)/
        .exec(navigator.userAgent);

    if (m) {

        var minor = parseInt(m[2], 16);

        var ms = minor.toString(16);

        if (ms.length < 2) {
            ms = "0" + ms;
        }

        key = m[1] + "." + ms;

        fwnum =
            parseInt(m[1], 10) * 100 +
            parseInt(ms, 10);
    }

    var bug = null;
    var why = "";

    var forced = params.get("bug");

    if (
        forced === "lapse" ||
        forced === "poops"
    ) {

        bug = forced;

        why =
            "forced via ?bug=" +
            forced;

    } else if (!key) {

        why =
            "user-agent is not a PlayStation 4";

    } else if (fwnum <= 1202) {

        bug = "lapse";

        why =
            key +
            " <= 12.02";

    } else if (fwnum >= 1250) {

        bug = "poops";

        why =
            key +
            " >= 12.50";

    } else {

        why =
            key +
            " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }

    detEl.innerHTML =
        "firmware <b>" +
        (key || "unknown") +
        "</b> &middot; bug <b>" +
        (bug || "none") +
        "</b> &middot; " +
        why;

    if (!bug) {

        setState(
            "UNSUPPORTED FIRMWARE",
            "bad"
        );

        return;
    }

    var target =
        (
            bug === "lapse"
                ? "run_lapse.html"
                : "run_poops.html"
        ) +
        location.search;

    function go() {

        setState(
            "loading " +
            bug +
            " chain...",
            "warn"
        );

        location.replace(target);
    }

    function waitForTap(msg, action) {

        setState(
            msg,
            "warn"
        );

        function fire() {

            window.removeEventListener(
                "click",
                fire
            );

            window.removeEventListener(
                "keydown",
                fire
            );

            action();
        }

        window.addEventListener(
            "click",
            fire
        );

        window.addEventListener(
            "keydown",
            fire
        );
    }

    var ac =
        window.applicationCache;

    if (
        !ac ||
        !document.documentElement
            .hasAttribute("manifest")
    ) {

        go();

    } else if (!navigator.onLine) {

        setCache(
            "offline -- from cache",
            true
        );

        go();

    } else if (
        ac.status === ac.IDLE
    ) {

        setCache(
            "cached",
            true
        );

        go();

    } else if (
        ac.status === ac.UPDATEREADY
    ) {

        try {
            ac.swapCache();
        } catch (e) {}

        setCache(
            "update downloaded",
            true
        );

        waitForTap(
            "UPDATE READY -- Tekan tombol Enter  X/O",
            function () {
                location.reload();
            }
        );

    } else {

        setCache(
            "checking cache..."
        );

        ac.addEventListener(
            "downloading",
            function () {

                setCache(
                    "caching for offline (first run)..."
                );

            },
            false
        );

        ac.addEventListener(
            "progress",
            function (e) {

                if (e && e.total) {

                    setCache(
                        "caching " +
                        Math.round(
                            (e.loaded / e.total) * 100
                        ) +
                        "%"
                    );
                }

            },
            false
        );

        ac.addEventListener(
            "cached",
            function () {

                setCache(
                    "cached for offline use",
                    true
                );

                waitForTap(
                    "CACHED (first run) -- Tekan tombol Enter  X/O",
                    go
                );

            },
            false
        );

        ac.addEventListener(
            "updateready",
            function () {

                try {
                    ac.swapCache();
                } catch (e) {}

                setCache(
                    "update downloaded",
                    true
                );

                waitForTap(
                    "UPDATE READY -- Tekan tombol Enter  X/O",
                    function () {
                        location.reload();
                    }
                );

            },
            false
        );

        ac.addEventListener(
            "noupdate",
            function () {

                setCache(
                    "cached -- offline ready",
                    true
                );

                go();

            },
            false
        );

        ac.addEventListener(
            "error",
            function () {

                setCache(
                    "cache unavailable"
                );

                waitForTap(
                    "CACHE FAILED -- Tekan tombol Enter  X/O",
                    go
                );

            },
            false
        );

        ac.addEventListener(
            "obsolete",
            function () {

                setCache(
                    "cache obsolete"
                );

                waitForTap(
                    "CACHE OBSOLETE -- Tekan tombol Enter  X/O",
                    go
                );

            },
            false
        );
    }

})();
</script>

</body>
</html>
